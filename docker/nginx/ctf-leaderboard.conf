# ctf-leaderboard.conf: /leaderboard/ to ctf-central, for the docker/ TEST
# SETUP only, where everything shares one address (DESIGN.md §2.1). In
# production ctf-central has a vhost of its own on neo-jmnl-node.
#
# Needs `set $up_central http://ctf-central:8080;` in the server block.

location = /leaderboard {
    return 302 /leaderboard/;
}

location /leaderboard/ {
    proxy_pass $up_central;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /admin/ has NO login of its own (§8.4): nginx is the lock. Here a test
# password (admin / admin, ctf-admin.htpasswd); on the node an IP allow-list
# plus a real htpasswd in /etc/jmnl/nginx/secrets. Basic auth is fine HERE:
# unlike Juice Shop, ctf-central never sends an Authorization header itself.
location /leaderboard/admin/ {
    auth_basic "Juice Shop CTF admin";
    auth_basic_user_file /etc/nginx/ctf-admin.htpasswd;
    proxy_pass $up_central;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
