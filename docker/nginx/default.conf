# default.conf: nginx for the docker/ test setup (DESIGN.md §12).
#
#   :80    instance 1   http://<ip>/ctf/  /juiceshop/  /leaderboard/
#   :8080  instance 2   the same paths, for `docker compose --profile second`
#
# Each server block names its own containers and includes the same two
# snippets. Port 8080 answers 502 on /ctf/ when the second instance is not
# started; that is expected.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    # Redirects stay relative (Location: /ctf/), so they keep whatever port
    # and address the browser used: localhost, the machine's IP, a mapped port.
    absolute_redirect off;
    # 2s: a recreated container gets a new address, and every nginx worker
    # keeps the old one for this long — 502s until it expires.
    resolver 127.0.0.11 valid=2s ipv6=off;
    # Juice Shop's upload challenges (complaint file, B2B order) need more
    # than nginx's 1 MB default.
    client_max_body_size 10m;

    set $up_juiceshop http://juiceshop:3000;
    set $up_status    http://ctf-status:8080;
    set $up_central   http://ctf-central:8080;

    include /etc/nginx/snippets/ctf-instance.conf;
    include /etc/nginx/snippets/ctf-leaderboard.conf;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    resolver 127.0.0.11 valid=2s ipv6=off;
    client_max_body_size 10m;

    set $up_juiceshop http://juiceshop-2:3000;
    set $up_status    http://ctf-status-2:8080;
    set $up_central   http://ctf-central:8080;

    include /etc/nginx/snippets/ctf-instance.conf;
    include /etc/nginx/snippets/ctf-leaderboard.conf;
}
