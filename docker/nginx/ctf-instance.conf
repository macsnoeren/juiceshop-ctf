# ctf-instance.conf: the path layout and the door of ONE CTF instance
# (DESIGN.md §2.1, §5.3). Included in a server block that first sets
#
#   set $up_juiceshop http://<juiceshop container>:3000;
#   set $up_status    http://<ctf-status container>:8080;
#
# >>> THIS FILE IS WHAT THE NODE'S web-nginx VHOST CARRIES OVER. Copy these
# locations as they are into nodes/<node>/nginx/conf.d/<site>.conf in
# jmnl-external-servers, with the two `set` lines in front. Everything here
# was tested against Juice Shop 20.3.0 (TASKS.md T01); change it only with
# the e2e test running.
#
#   /            → 302 /ctf/
#   /ctf/        → ctf-status, never gated (it IS the door)
#   /juiceshop/  → Juice Shop, gated, prefix stripped
#   /assets/     → Juice Shop, gated: the ONE absolute path its frontend uses
#                  (translations under /assets/i18n/, one tutorial image)
#
# The upstreams are variables with Docker's resolver, so nginx starts even when
# a container is not (yet) running, and finds it again after a restart. A
# hard-coded upstream would be resolved once at start, and a stopped
# ctf-status would keep nginx itself from starting.

location = / {
    return 302 /ctf/;
}

# --- the door ---------------------------------------------------------------

location /ctf/ {
    proxy_pass $up_status;
    proxy_set_header Host $host;
    # The access-code rate limit counts per client address (§5.3). nginx
    # REPLACES whatever the client sent here, so it cannot be spoofed.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# auth_request target. `internal`: a client cannot call it directly. The
# variable proxy_pass with a URI sends exactly /ctf/gate, whatever was asked.
location = /_ctf_gate {
    internal;
    proxy_pass $up_status/ctf/gate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# No valid cookie: back to the door. A 302 on an XHR is not pretty, but the
# shop's own pages only make XHRs after the page itself got through.
location @ctf_door {
    return 302 /ctf/;
}

# --- the shop ---------------------------------------------------------------

location = /juiceshop {
    return 302 /juiceshop/;
}

# >>> NO CONTINUE CODES FROM STUDENTS. Juice Shop's frontend keeps the
# progress in a cookie (continueCode, -FindIt, -FixIt; a year long) and,
# whenever it sees the server start, PUTs it to /rest/continue-code*/apply/.
# Left open, that means (found on cybersecurity-1, 2026-11-18):
#   - after a reset, the browser puts the old progress straight back;
#   - on a shared lab PC the next student inherits the previous one's solves,
#     AFTER signing up — so the agent counts them for the new student;
#   - a student can paste a classmate's code and take all of their points.
# The agent restores progress itself, directly on juiceshop:3000 (DESIGN.md
# §6.2), so nothing legitimate comes through here. Case-insensitive, because
# Express routes case-insensitively: /juiceshop/REST/Continue-Code/apply/
# reaches the same handler. A regex location, so it wins over /juiceshop/.
location ~* ^/juiceshop/rest/continue-code[^/]*/apply(/|$) {
    return 403;
}

location /juiceshop/ {
    auth_request /_ctf_gate;
    error_page 401 = @ctf_door;

    # Juice Shop runs at / inside its container and gets BASE_PATH=/juiceshop
    # for the redirects it builds itself. nginx strips the prefix on the way
    # in, and puts it back on any Location header that lacks it.
    rewrite ^/juiceshop/(.*)$ /$1 break;
    proxy_pass $up_juiceshop;
    proxy_redirect ~^/(?!juiceshop/)(.*)$ /juiceshop/$1;

    # socket.io connects RELATIVE to the page, so /juiceshop/socket.io/: the
    # WebSocket upgrade must be allowed here, or the "challenge solved"
    # pop-ups fall back to polling (and the Score Board tutorial stalls).
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
}

location /assets/ {
    auth_request /_ctf_gate;
    error_page 401 = @ctf_door;
    proxy_pass $up_juiceshop;
    proxy_set_header Host $host;
}
