# Juice Shop CTF: the whole thing on one machine (DESIGN.md §12).
#
#   cd docker && docker compose up --build
#   http://<ip>/ctf/          sign up            (access code: test1)
#   http://<ip>/juiceshop/    the shop, after signing up
#   http://<ip>/leaderboard/  the board          (/leaderboard/admin/: admin / admin)
#
#   docker compose --profile second up --build   adds instance 2 on :8080 (code test2)
#
#               :80 / :8080
#                    │
#                  nginx ─────────────── ctf-front ───────────── ctf-status ── ctf-internal ── ctf-agent
#                    │                       │                                                │   │
#                    │                   ctf-central ◄──────── report (ctf-front) ────────────┘   │
#                    └──── ctf-juice (internal) ──── juiceshop ──── webhook ──────────────────────┘
#
# The networks are those of the node (DESIGN.md §4):
#
#   ctf-juice     INTERNAL: juiceshop, nginx, ctf-agent. Juice Shop is on this
#                 network ONLY, so its SSRF reaches nginx and the agent's
#                 webhook port and nothing else, and it has no route out.
#   ctf-internal  INTERNAL: ctf-status ↔ ctf-agent's API.
#   ctf-front     nginx ↔ ctf-status and ctf-central; the agent's way to the
#                 central server (on a node: the internet).
#
# The agent binds each of its listeners to an ALIAS on one network
# (ctf-agent-hook on ctf-juice, ctf-agent-api on ctf-internal), so its
# internal API is not even listening where Juice Shop can reach it.
#
# Ports: CTF_HTTP_PORT (default 80) and CTF_HTTP_PORT_2 (default 8080) when
# those are taken, e.g. `CTF_HTTP_PORT=8000 docker compose up`.

name: juiceshop-ctf

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  # --- instance 1 ----------------------------------------------------------

  juiceshop:
    # >>> Pinned. Upgrading means capturing the fixtures again
    # (internal/juiceshop/testdata/README.md) and running tests/e2e.sh.
    image: bkimminich/juice-shop:v20.3.0
    environment:
      # Only for the redirects Juice Shop builds itself; nginx strips the
      # prefix on the way in (docker/nginx/ctf-instance.conf).
      BASE_PATH: /juiceshop
      SOLUTIONS_WEBHOOK: http://ctf-agent-hook:8081/webhook
    networks: [ctf-juice]
    # Not read_only: Juice Shop rewrites its SQLite file and uploads on start.
    # No volume either: its state is disposable, the agent restores it (§6.2).
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 256
    restart: unless-stopped

  ctf-agent:
    build: { context: .., dockerfile: docker/Dockerfile.agent, args: { VERSION: "0.1.0-docker" } }
    image: juiceshop-ctf-agent:latest
    <<: *hardened
    env_file: [{ path: env/agent-1.env, required: true }]
    environment:
      JUICESHOP_URL: http://juiceshop:3000
      CTF_WEBHOOK_ADDR: ctf-agent-hook:8081
      CTF_API_ADDR: ctf-agent-api:8082
      # Faster than production (30s / 60s / 5m), so a test or a lab does not
      # wait minutes: a reset from /admin/ rides on the answer to the next
      # report, so REPORT_INTERVAL is also how long a reset takes to arrive.
      POLL_INTERVAL: 5s
      REPORT_INTERVAL: 15s
      REPORT_BACKOFF_MAX: 10s
    volumes: [ctf-agent-state:/var/lib/ctf-agent]
    networks:
      ctf-juice: { aliases: [ctf-agent-hook] }
      ctf-internal: { aliases: [ctf-agent-api] }
      ctf-front: {}
    depends_on: [juiceshop]

  ctf-status:
    build: { context: .., dockerfile: docker/Dockerfile.status, args: { VERSION: "0.1.0-docker" } }
    image: juiceshop-ctf-status:latest
    <<: *hardened
    env_file: [{ path: env/status-1.env, required: true }]
    environment:
      CTF_AGENT_URL: http://ctf-agent-api:8082
      CTF_BASE_PATH: /ctf
      CTF_JUICESHOP_PATH: /juiceshop/
      CTF_LEADERBOARD_URL: /leaderboard/
    networks: [ctf-internal, ctf-front]
    depends_on: [ctf-agent]

  # --- the central server --------------------------------------------------

  ctf-central:
    build: { context: .., dockerfile: docker/Dockerfile.central, args: { VERSION: "0.1.0-docker" } }
    image: juiceshop-ctf-central:latest
    <<: *hardened
    env_file: [{ path: env/central.env, required: true }]
    environment:
      CTF_BASE_PATH: /leaderboard
      CTF_DB_PATH: /data/central.db
    volumes: [ctf-central-db:/data]
    tmpfs: [/tmp]
    networks: [ctf-front]

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${CTF_HTTP_PORT:-80}:80"
      - "${CTF_HTTP_PORT_2:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ctf-instance.conf:/etc/nginx/snippets/ctf-instance.conf:ro
      - ./nginx/ctf-leaderboard.conf:/etc/nginx/snippets/ctf-leaderboard.conf:ro
      - ./nginx/ctf-admin.htpasswd:/etc/nginx/ctf-admin.htpasswd:ro
    networks: [ctf-front, ctf-juice, ctf-juice-2]
    depends_on: [ctf-status, ctf-central]
    restart: unless-stopped

  # --- instance 2: docker compose --profile second up ------------------------

  juiceshop-2:
    profiles: [second]
    image: bkimminich/juice-shop:v20.3.0
    environment:
      BASE_PATH: /juiceshop
      SOLUTIONS_WEBHOOK: http://ctf-agent-2-hook:8081/webhook
    networks: [ctf-juice-2]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 256
    restart: unless-stopped

  ctf-agent-2:
    profiles: [second]
    build: { context: .., dockerfile: docker/Dockerfile.agent, args: { VERSION: "0.1.0-docker" } }
    image: juiceshop-ctf-agent:latest
    <<: *hardened
    env_file: [{ path: env/agent-2.env, required: true }]
    environment:
      JUICESHOP_URL: http://juiceshop-2:3000
      CTF_WEBHOOK_ADDR: ctf-agent-2-hook:8081
      CTF_API_ADDR: ctf-agent-2-api:8082
      POLL_INTERVAL: 5s
      REPORT_INTERVAL: 15s
      REPORT_BACKOFF_MAX: 10s
    volumes: [ctf-agent-state-2:/var/lib/ctf-agent]
    networks:
      ctf-juice-2: { aliases: [ctf-agent-2-hook] }
      ctf-internal-2: { aliases: [ctf-agent-2-api] }
      ctf-front: {}
    depends_on: [juiceshop-2]

  ctf-status-2:
    profiles: [second]
    build: { context: .., dockerfile: docker/Dockerfile.status, args: { VERSION: "0.1.0-docker" } }
    image: juiceshop-ctf-status:latest
    <<: *hardened
    env_file: [{ path: env/status-2.env, required: true }]
    environment:
      CTF_AGENT_URL: http://ctf-agent-2-api:8082
      CTF_BASE_PATH: /ctf
      CTF_JUICESHOP_PATH: /juiceshop/
      CTF_LEADERBOARD_URL: /leaderboard/
    networks: [ctf-internal-2, ctf-front]
    depends_on: [ctf-agent-2]

networks:
  ctf-front: {}
  ctf-juice: { internal: true }
  ctf-internal: { internal: true }
  ctf-juice-2: { internal: true }
  ctf-internal-2: { internal: true }

volumes:
  ctf-agent-state: {}
  ctf-agent-state-2: {}
  ctf-central-db: {}
