{{define "enter"}}{{template "head" "Enter"}}
<section class="card">
  <h1>Enter your Juice Shop</h1>
  <p>This instance is registered. Enter the access code to open it in this browser.</p>
  {{template "error" .}}
  <form method="post" action="{{path "/enter"}}">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="code">Access code</label>
    <input id="code" name="code" type="password" required autocomplete="off" autofocus>
    <button type="submit">Open the shop</button>
  </form>
</section>
{{if .LeaderboardURL}}<p class="center"><a href="{{.LeaderboardURL}}">View the leaderboard</a></p>{{end}}
{{template "foot"}}{{end}}
