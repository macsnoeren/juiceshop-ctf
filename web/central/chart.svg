{{define "chart.svg"}}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{.W}} {{.H}}" role="img" aria-label="{{.Summary}}" font-family="Roboto, Noto Sans, Helvetica Neue, Segoe UI, Arial, sans-serif" font-size="12">
<title>{{.Summary}}</title>
<style>
.axis{stroke:#5a5a5a;stroke-width:1}.grid{stroke:#3a3b3e;stroke-width:1}.t{fill:#b8c0c7}.l{fill:#e8ecef;font-weight:500}
polyline{fill:none;stroke:var(--c);stroke-width:2.5;stroke-linejoin:round}tspan{fill:var(--c)}
.s0{--c:#70e000}.s1{--c:#4dabf7}.s2{--c:#ff8c42}.s3{--c:#da77f2}.s4{--c:#ffd43b}.s5{--c:#3bc9db}.s6{--c:#f783ac}.s7{--c:#a9e34b}.s8{--c:#748ffc}.s9{--c:#ced4da}
</style>
{{if .Empty}}<text class="t" x="{{.Left}}" y="{{.Base}}">No points scored yet.</text>{{else}}
{{range .YTicks}}<line class="grid" x1="{{$.Left}}" x2="{{$.Right}}" y1="{{.Pos}}" y2="{{.Pos}}"/><text class="t" x="{{$.Left}}" dx="-6" y="{{.Pos}}" dy="4" text-anchor="end">{{.Label}}</text>
{{end}}<line class="axis" x1="{{.Left}}" x2="{{.Right}}" y1="{{.Base}}" y2="{{.Base}}"/>
{{range .XTicks}}<text class="t" x="{{.Pos}}" y="{{$.Base}}" dy="18" text-anchor="middle">{{.Label}}</text>
{{end}}{{range .Lines}}<polyline class="s{{.Index}}" points="{{.Points}}"/>
{{end}}{{range .Lines}}<text class="l" x="{{.LX}}" y="{{.LY}}"><tspan class="s{{.Index}}">━</tspan> {{.Label}} {{.Score}}</text>
{{end}}{{end}}</svg>{{end}}
