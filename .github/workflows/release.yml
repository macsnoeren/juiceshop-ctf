# release: one version of Juice Shop CTF, everywhere at once.
#
#   git tag v1.1.0 && git push origin v1.1.0         (or: Actions → release → Run, version v1.1.0)
#
#   prepare   check the version and CHANGELOG.md (scripts/release-notes.sh),
#             make the tag (manual run only) and a DRAFT GitHub release
#   test      unit tests, the image test and the end-to-end test, at the tag
#   docker    macsnoeren/juiceshop-ctf-central:  1.1.0, 1.1, latest   (amd64 + arm64)
#   vm        the students' VM (deploy/vm/build.sh, Packer + QEMU with KVM),
#             pointed at vars.CENTRAL_URL (below):
#             juiceshop-ctf-v1.1.0-virtualbox.ova, -vmware.zip and .sha256 on the release
#   publish   the draft release made public — only when docker AND vm succeeded
#
# ONE VERSION STRING, from the tag: the binaries print it (VERSION build arg →
# internal/version), the VM carries it in its file names and on its
# console, admin shows it per VM, and Docker Hub gets it without the "v".
# A pre-release (v1.2.0-rc.1) is marked so on GitHub, and Docker Hub gets
# only its full version, never "latest" or "1.2".
#
# Why a tag and not every push to main (as guacamole-datadiode does): a
# release here is a VM of a gigabyte that thirty students import; it should
# be a decision, with a CHANGELOG entry, not a side effect of a merge.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions),
# the same names as guacamole-datadiode's: DH_USERNAME and DH_PASSWORD (a
# Docker Hub access token with read/write). And, optionally, one repository
# VARIABLE (same page, tab Variables): CENTRAL_URL, the central server the
# released VM joins unless a student picks another on its page, e.g.
# https://ctf.example.org (https only). Without it the VM knows no central server and the
# student types the address on the page. It is not in this file on purpose:
# where a class's central server runs is the operator's business, not the
# repository's. A failed run leaves the release a draft: fix, delete the
# draft and the tag, and tag again.
#
# Why it failed shows as an annotation on the run's summary page; the
# "Node.js 20 is deprecated" kind are warnings, never the cause.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release: vMAJOR.MINOR.PATCH, e.g. v1.1.0 or v1.2.0-rc.1, with its section in CHANGELOG.md — tagged on the branch chosen above'
        required: true

# Read-only by default; the three jobs that make, fill and publish the
# release ask for write themselves. The test and docker jobs run the
# repository's own scripts, and need no write access to it.
permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  NAMESPACE: macsnoeren
  CENTRAL_IMAGE: juiceshop-ctf-central

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the tag (manual run) and the draft release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check the version and write the release notes
        id: version
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          CENTRAL_URL: ${{ vars.CENTRAL_URL }}
        run: |
          set -euo pipefail
          bash scripts/release-notes.sh "$TAG" > notes.md
          # ctf-node refuses to start on a malformed default, and the VM
          # would then be useless: caught here, not after a 10-minute build.
          # HTTPS ONLY: a released VM goes to a central server on the
          # internet, and over plain http anyone on the way reads the join
          # code and every token.
          if [ -n "$CENTRAL_URL" ] && ! [[ "$CENTRAL_URL" =~ ^https://[^/?#@[:space:]]+(/[^?#[:space:]]*)?$ ]]; then
            echo "::error title=CENTRAL_URL::the repository variable CENTRAL_URL is '$CENTRAL_URL': give https://host[/path], or remove it"
            exit 1
          fi
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          docker_version="${TAG#v}"
          if [ -n "$CENTRAL_URL" ]; then
            central="The VM joins the central server \`${CENTRAL_URL%/}\` unless a student picks another on its CTF page (*Central server*)."
          else
            central="The VM has no central server built in: a student types its address on the CTF page (*Central server*), or plays on the VM alone."
          fi
          cat >> notes.md <<EOF

          ## Downloads

          | File | For |
          |------|-----|
          | \`juiceshop-ctf-${TAG}-virtualbox.ova\` | VirtualBox: *File → Import Appliance…* |
          | \`juiceshop-ctf-${TAG}-vmware.zip\` | VMware Workstation, Player, Fusion: unzip, open the \`.vmx\` |
          | \`juiceshop-ctf-${TAG}.sha256\` | checksums of both |

          ${central}

          The students' sheet: [docs/STUDENT.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/STUDENT.md).

          The central server:

          \`\`\`sh
          docker pull ${NAMESPACE}/${CENTRAL_IMAGE}:${docker_version}
          \`\`\`

          Licensed under the [GNU GPL v3.0 or later](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/LICENSE). The source of this release is the tag [\`${TAG}\`](https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}) (the *Source code* archives below).
          EOF
          {
            echo "tag=$TAG"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the chosen branch (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG exists already; a version is released once"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Juice Shop CTF $TAG"
          # Pushed with GITHUB_TOKEN, so it does not start this workflow a
          # second time; this run carries on with the tag.
          git push origin "$TAG"

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::release $TAG is published already; it is never overwritten"
              exit 1
            fi
            gh release edit "$TAG" --notes-file notes.md   # a re-run of a failed release
          else
            args=(--draft --verify-tag --title "Juice Shop CTF $TAG" --notes-file notes.md)
            [ "$PRERELEASE" = true ] && args+=(--prerelease)
            gh release create "$TAG" "${args[@]}"
          fi

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - name: Unit tests (gofmt, vet, -race)
        run: bash scripts/test.sh
      - name: The image on its own
        run: bash scripts/image.sh
      - name: End to end
        run: bash scripts/e2e.sh

  docker:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DH_USERNAME }}
          password: ${{ secrets.DH_PASSWORD }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.NAMESPACE }}/${{ env.CENTRAL_IMAGE }}
          # 1.1.0 and 1.1, and latest — the last two only for a release, not
          # for a pre-release (metadata-action leaves them out for v1.2.0-rc.1).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
          flavor: |
            latest=${{ needs.prepare.outputs.prerelease == 'false' }}

      - name: Build and push the central server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile.central
          # Cross-compiled in the Go stage, no emulation (see the Dockerfile).
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.prepare.outputs.tag }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The version in the pushed image
        env:
          IMAGE: ${{ env.NAMESPACE }}/${{ env.CENTRAL_IMAGE }}:${{ steps.meta.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          got="$(docker run --rm "$IMAGE" -version)"
          echo "$got"
          [ "$got" = "ctf-central $TAG" ] || { echo "::error::the image says '$got', not 'ctf-central $TAG'"; exit 1; }

      - name: Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DH_USERNAME }}
          password: ${{ secrets.DH_PASSWORD }}
          repository: ${{ env.NAMESPACE }}/${{ env.CENTRAL_IMAGE }}
          short-description: 'Central server of Juice Shop CTF: games, live leaderboards and admin for a class.'
          readme-filepath: deploy/docker/DOCKERHUB.md

  vm:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the OVA and the zip on the draft release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      # GitHub's Linux runners have KVM, but /dev/kvm is not open to the
      # runner's user until this rule says so. Without it build.sh falls back
      # to emulation and takes over an hour.
      - name: Open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build and test the VM
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
          CENTRAL_URL: ${{ vars.CENTRAL_URL }}
        run: bash deploy/vm/build.sh

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist/vm
          sha256sum -c "juiceshop-ctf-$TAG.sha256"
          gh release upload "$TAG" --clobber \
            "juiceshop-ctf-$TAG-virtualbox.ova" \
            "juiceshop-ctf-$TAG-vmware.zip" \
            "juiceshop-ctf-$TAG.sha256"

  publish:
    needs: [prepare, docker, vm]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the draft release made public
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--draft=false)
          [ "$PRERELEASE" = false ] && args+=(--latest)
          gh release edit "$TAG" "${args[@]}"
          gh release view "$TAG" --json url --jq .url
